# The data of this app's README.md. CI renders README.md from it (docs/readme.md in LukeNeedham/ci-workflows):
# edit this file, never README.md.

name: AppHub
tagline: Install and try the pull request builds of my apps straight from my phone.

description: |
  AppHub lists the open pull requests of the public repos of `LukeNeedham`, with each PR's debug APK and web test
  deploy, so a PR build can be installed and tried on a phone without a computer. It reads the comment that the shared
  CI ([ci-workflows](https://github.com/LukeNeedham/ci-workflows)) leaves on every PR.

features:
  - "**Lists** the open PRs of every public repo of `LukeNeedham` (one search call), grouped by repo. A PR that is merged or closed drops off the list on the next refresh (pull down), and its downloaded APK is deleted."
  - "**Collapsible projects.** Each repo is a card that collapses to its header; a PR shows only its title, a status tag and its actions: download/install, Web, Claude session, Open PR."
  - "**Reads the PR's comments**: the APK link comes from the shared CI comment, the web link from a deploy comment on a known preview host (Netlify, Vercel, Cloudflare Pages, Firebase, GitHub Pages and so on; see `CommentParser.previewHosts`)."
  - "**Downloads and installs the APK itself**, with progress and a state (downloading, downloaded, failed), then opens the system installer. \"Open PR\" opens the PR in the browser (or the GitHub app, if it handles links); \"Claude session\" opens the Claude Code session linked in the PR description or comments, if there is one."
  - "**A page per PR.** \"Details\" on a PR opens its own page: title, number, author, status, the same actions and the PR description."
  - "**Deep link.** `https://www.lukeneedham.com/apphub/pr/<repo name>/<number>` (for example `https://www.lukeneedham.com/apphub/pr/AppHub/10`) opens that PR's page. The repo is in the link because PR numbers repeat across repos; the owner is always `LukeNeedham`. The shared CI puts this link in its PR comment."
  - "**Stale builds.** While a newer commit is rebuilding, the card still offers the previous APK, marked as out of date."
  - "**Says whether the PR's build is installed.** Debug builds share a version number, so AppHub remembers which commit it installed for each app and when; a later change to the installed app (another build) makes it read \"a different build is installed\"."
  - "**Builds main on demand.** With a token, every repo that has `build_main.yml` shows a \"Latest main\" row: a **Build main** button starts the shared workflow [`android_main_build.yml`](https://github.com/LukeNeedham/ci-workflows/blob/main/.github/workflows/android_main_build.yml) on `main` through the API, follows the run, and offers to download and install the APK when it is done. Once installed it says whether that is the latest main, or how many commits `main` has since. The build is an artifact of the run and expires after **one day**."

user:
  min-android: "8.0 (API 26)"
  install: Download the debug APK from the comment that CI posts on any pull request of this repo, and install it. The first time, Android asks to allow AppHub to install apps.
  steps:
    - "Optional: add a GitHub personal access token under Settings → GitHub, for a higher rate limit and for building main (see Limits)."

developer:
  notes: |
    See `CLAUDE.md` and the `lukeneedham-conventions` skill for the conventions of this repo. In debug builds, Settings
    (top right) leads to the Debug page.

structure:
  - "`app/`: the app module (`com.lukeneedham.apphub`), with these packages in `app/src/main/kotlin/`:"
  - "`domain`: pure Kotlin, unit-tested"
  - "`data`: GitHub, downloads and installing"
  - "`ui`: the screens (Compose), with `ui/theme`, the app's own theme"
  - "`di`: Koin modules"
  - "`docs/`: notes such as `status-colors.md`, the colours and icons of the PR status pill"

architecture: |
  Single activity with Compose, Navigation 3, MVVM and Koin.

sections:
  - title: Limits
    body: |
      - Sign-in is optional. Without a token only public repos are visible and GitHub allows 60 anonymous requests an
        hour per IP address (a shared Wi-Fi, VPN or mobile network shares it). With a personal access token (Settings →
        GitHub; a fine-grained token with "Public repositories (read-only)" and nothing else) it is 5,000. The token is
        checked with GitHub before it is kept, stored encrypted with an Android Keystore key, and sent only to
        `api.github.com`.
      - Building main needs a token with the **Actions: Read and write** permission on the repo (a fine-grained token
        for "All repositories", or the selected ones); downloading its APK needs Actions read, because artifacts, unlike
        release assets, are not public. Without the permission the row shows, and the button says what is missing. The row
        costs a few requests per repo on a refresh (the runs, the tip of main, and the artifact), most of them revalidated
        for free.
      - A refresh is one request to list the open PRs, plus one per PR whose `updated_at` changed since the last refresh
        (a new or edited comment bumps it); the parsed PRs are kept on disk. When the limit is hit the app keeps showing
        the last list and says when to retry.
      - The "installed" check only knows about installs done through AppHub, and learns an app's package name from the
        first APK downloaded for its repo.
      - A download stops if the app is closed.
      - The status of a main build is read every ten seconds while a build runs, and only while AppHub is running: there
        is no notification when it finishes.

